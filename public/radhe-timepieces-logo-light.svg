<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" width="640" height="600" role="img" aria-label="Radhe Timepieces logo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D4A94A"/>
      <stop offset="0.5" stop-color="#B98B2E"/>
      <stop offset="1" stop-color="#9A6F1E"/>
    </linearGradient>
    <radialGradient id="eye" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0B3C8C"/>
      <stop offset="1" stop-color="#062455"/>
    </radialGradient>
  </defs>

  <!-- Peacock feather -->
  <g fill="none" stroke="url(#gold)" stroke-linecap="round">
    <path d="M338 300 C 340 220 344 130 352 40" stroke-width="3"/>
    <g stroke-width="2">
      <path d="M340 285 C 300 270 270 240 255 205"/>
      <path d="M341 262 C 296 245 268 210 256 170"/>
      <path d="M342 238 C 300 215 278 180 272 140"/>
      <path d="M344 214 C 306 190 292 150 292 108"/>
      <path d="M346 190 C 316 160 312 120 318 80"/>
      <path d="M341 285 C 385 272 415 245 428 210"/>
      <path d="M342 262 C 388 246 418 212 426 172"/>
      <path d="M343 238 C 384 218 408 184 412 144"/>
      <path d="M345 214 C 380 192 396 156 394 112"/>
      <path d="M347 190 C 372 164 380 126 374 84"/>
    </g>
  </g>

  <!-- Feather eye = watch dial -->
  <g transform="translate(346 168)">
    <ellipse rx="44" ry="52" fill="url(#gold)"/>
    <circle r="33" fill="#1E9C9A"/>
    <circle r="27" fill="#FBF6EA"/>
    <circle r="27" fill="none" stroke="#062455" stroke-width="1.5"/>
    <g stroke="#062455" stroke-width="2" stroke-linecap="round">
      <line x1="0" y1="-24" x2="0" y2="-20"/>
      <line x1="24" y1="0" x2="20" y2="0"/>
      <line x1="0" y1="24" x2="0" y2="20"/>
      <line x1="-24" y1="0" x2="-20" y2="0"/>
    </g>
    <g stroke="#062455" stroke-linecap="round">
      <line x1="0" y1="0" x2="0" y2="-17" stroke-width="3"/>
      <line x1="0" y1="0" x2="12" y2="6" stroke-width="3"/>
    </g>
    <circle r="3.5" fill="url(#eye)"/>
  </g>

  <!-- Wordmark -->
  <text x="320" y="430" text-anchor="middle" font-family="'Cormorant Garamond','Playfair Display',Georgia,serif" font-size="190" font-weight="600" fill="url(#gold)">Radhe</text>

  <!-- Swash + hanging watch charm (replaces the jhumka) -->
  <path d="M120 400 C 70 395 62 330 110 312 C 150 300 210 304 250 316" fill="none" stroke="url(#gold)" stroke-width="6" stroke-linecap="round"/>
  <line x1="104" y1="318" x2="104" y2="372" stroke="url(#gold)" stroke-width="2"/>
  <g transform="translate(104 398)">
    <rect x="-4" y="-30" width="8" height="8" rx="2" fill="url(#gold)"/>
    <circle r="20" fill="url(#gold)"/>
    <circle r="15" fill="#FBF6EA"/>
    <line x1="0" y1="0" x2="0" y2="-10" stroke="#062455" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="7" y2="3" stroke="#062455" stroke-width="2" stroke-linecap="round"/>
    <circle r="2" fill="#062455"/>
  </g>

  <!-- Subtitle -->
  <text x="330" y="495" text-anchor="middle" font-family="'Cormorant Garamond',Georgia,serif" font-size="38" letter-spacing="16" fill="#FAF5EE">TIMEPIECES</text>

  <!-- Divider with lotus -->
  <line x1="150" y1="535" x2="285" y2="535" stroke="url(#gold)" stroke-width="2"/>
  <line x1="355" y1="535" x2="490" y2="535" stroke="url(#gold)" stroke-width="2"/>
  <g fill="url(#gold)">
    <path d="M320 548 C 308 540 308 526 320 516 C 332 526 332 540 320 548Z"/>
    <path d="M316 548 C 302 548 298 536 300 528 C 310 530 316 538 316 548Z"/>
    <path d="M324 548 C 338 548 342 536 340 528 C 330 530 324 538 324 548Z"/>
  </g>
</svg>
