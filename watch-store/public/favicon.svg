<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dfba73"/>
      <stop offset="50%" stop-color="#c99738"/>
      <stop offset="100%" stop-color="#936816"/>
    </linearGradient>
  </defs>
  <!-- Outer Ring -->
  <circle cx="16" cy="16" r="14" fill="#121212" stroke="url(#goldGrad)" stroke-width="2.5"/>
  <!-- Inner Ring -->
  <circle cx="16" cy="16" r="11" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.6"/>
  <!-- Crown / Top Lug -->
  <rect x="14.5" y="0.5" width="3" height="2" rx="0.5" fill="url(#goldGrad)"/>
  <rect x="14.5" y="29.5" width="3" height="2" rx="0.5" fill="url(#goldGrad)"/>
  <!-- Crown Winder -->
  <rect x="29.5" y="14.5" width="2" height="3" rx="0.5" fill="url(#goldGrad)"/>
  <!-- Dial Hands -->
  <line x1="16" y1="16" x2="16" y2="8" stroke="url(#goldGrad)" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="16" y1="16" x2="21" y2="16" stroke="url(#goldGrad)" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Center Pin -->
  <circle cx="16" cy="16" r="1.5" fill="#fdf2d0"/>
</svg>
